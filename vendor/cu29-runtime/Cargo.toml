[package]
edition = "2024"
name = "cu29-runtime"
version = "0.14.0"
authors = ["Guillaume Binet <gbin@gootz.net>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Copper Runtime Runtime crate. Copper is an engine for robotics."
homepage = "https://github.com/copper-project"
documentation = "https://docs.rs/cu29"
readme = "README.md"
keywords = [
    "robotics",
    "middleware",
    "copper",
    "real-time",
]
categories = ["science::robotics"]
license = "Apache-2.0"
repository = "https://github.com/copper-project/copper-rs"

[features]
async-cl-io = ["std"]
bridge-sim-callbacks = []
cuda = ["dep:cudarc"]
default = ["std"]
defmt = [
    "cu29-log/defmt",
    "cu29-log-derive/defmt",
    "cu29-traits/defmt",
]
macro_debug = []
memory_monitoring = []
mmap-fsync = [
    "std",
    "cu29-unifiedlog/mmap-fsync",
]
parallel-rt = [
    "std",
    "dep:rtrb",
]
reflect = [
    "dep:bevy_reflect",
    "cu29-traits/reflect",
]
remote-debug = [
    "std",
    "reflect",
    "dep:serde_json",
    "dep:zenoh",
    "dep:minicbor-serde",
]
std = [
    "dep:clap",
    "dep:rayon",
    "dep:tempfile",
    "dep:object-pool",
    "dep:layout",
    "dep:svg",
    "dep:serde_json",
    "ron/std",
    "portable-atomic/std",
    "portable-atomic/require-cas",
    "cu29-clock/std",
    "cu29-log/std",
    "cu29-log-runtime/std",
    "cu29-traits/std",
    "cu29-unifiedlog/std",
    "cu29-value/std",
    "petgraph/std",
]
sysclock-perf = ["std"]

[lib]
name = "cu29_runtime"
path = "src/lib.rs"

[[bin]]
name = "cu29-rendercfg"
path = "src/rendercfg.rs"
required-features = ["std"]

[[test]]
name = "includes"
